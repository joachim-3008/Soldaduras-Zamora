<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soldaduras Zamora - Catálogo</title>
    <link rel="stylesheet" href="/output.css" />
  </head>
  <body class="bg-zinc-900 text-white min-h-screen flex flex-col font-sans selection:bg-amber-500 selection:text-zinc-950 overflow-x-hidden">
    
    <!-- NOTIFICACIONES -->
    <div id="notification"></div>

    <!-- NAVBAR SUPERIOR -->
    <header class="bg-zinc-950 border-b border-zinc-800 px-4 sm:px-6 py-3 flex items-center justify-between shadow-lg shrink-0 sticky top-0 z-40">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-full overflow-hidden border-2 border-amber-500 shrink-0 flex items-center justify-center bg-zinc-900 shadow-md">
          <img
            src="/media/logo-soldadura.jpg"
            alt="Soldaduras Zamora"
            class="w-full h-full object-cover"
          />
        </div>
        <span class="font-sans font-black text-xs sm:text-base tracking-widest uppercase block whitespace-nowrap text-zinc-100">
          Soldaduras Zamora
        </span>
      </div>

      <nav class="flex items-center gap-4 sm:gap-6 font-mono text-xs uppercase tracking-wider">
        <a href="/cart" class="flex items-center gap-2 text-zinc-300 hover:text-amber-400 transition-all font-bold whitespace-nowrap">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4 text-amber-500 shrink-0">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
          </svg>
          <span class="hidden sm:inline">Ver Carrito</span>
        </a>
        <button id="logout-button" class="text-zinc-400 hover:text-red-400 transition-all font-bold flex items-center gap-1 cursor-pointer bg-transparent border-none outline-none whitespace-nowrap">
          ✕ <span class="hidden sm:inline">Cerrar Sesión</span>
        </button>
      </nav>
    </header>

    <!-- BARRA DE BÚSQUEDA -->
    <div class="sticky top-[61px] sm:top-[69px] bg-zinc-900/95 backdrop-blur-md p-4 sm:px-6 pb-3 z-30 w-full border-b border-zinc-800/60">
      <div class="w-full max-w-7xl mx-auto flex justify-center">
        <div class="w-full max-w-5xl">
          <form id="search-form" class="w-full flex">
            <input
              type="text"
              id="search-input"
              placeholder="Buscar electrodos, inversores, herramientas..."
              class="w-full bg-zinc-950 text-white placeholder-zinc-500 font-mono text-xs sm:text-sm px-4 py-3 rounded-xl border border-zinc-700/80 outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all shadow-inner"
            />
          </form>
        </div>
      </div>
    </div>

    <!-- CUERPO PRINCIPAL -->
    <div class="flex flex-col lg:flex-row w-full max-w-8xl mx-auto px-4 sm:px-6 py-6 gap-6 flex-1 items-start min-w-0">
      
      <!-- BARRA LATERAL CATEGORÍAS -->
      <aside class="w-full lg:w-64 shrink-0 lg:sticky lg:top-[140px]">
        <div class="bg-zinc-950 border border-zinc-800 rounded-2xl p-5 flex flex-col gap-4 shadow-xl">
          <h2 class="font-sans font-black text-xs uppercase tracking-widest text-amber-500 border-b border-zinc-800 pb-3">
            Categorías
          </h2>
          <ul class="font-mono text-[11px] sm:text-sm uppercase tracking-wide flex flex-col gap-2.5 text-zinc-300">
            <!-- Cargado dinámicamente -->
          </ul>
        </div>
      </aside>

      <!-- CATÁLOGO DE PRODUCTOS -->
      <main class="flex-1 flex flex-col gap-6 w-full min-w-0">

        <!-- HEADER DE LA SECCIÓN -->
        <header class="bg-zinc-950 border border-zinc-800 rounded-2xl p-4 sm:p-5 flex items-center gap-4 shadow-md">
          <div class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center font-black text-amber-500 text-sm shadow-inner">
            SZ
          </div>
          <h1 id="current-category-name" class="font-sans font-bold text-base sm:text-lg uppercase text-zinc-100 tracking-wide">
            Todas las Categorías
          </h1>
        </header>

        <div id="product-detail-view" class="hidden w-full">
          <div class="bg-zinc-950 border border-zinc-800 rounded-2xl p-5 sm:p-6 shadow-xl">
            <button id="back-to-catalog-btn" type="button" class="mb-4 text-sm font-mono uppercase tracking-wider text-zinc-400 hover:text-amber-400 transition-colors">
              ← Volver al catálogo
            </button>
            <div id="product-detail-content" class="flex flex-col gap-10 lg:flex-row lg:items-start"></div>
          </div>
        </div>

        <!-- GRID DE PRODUCTOS + TARJETA DE AGREGAR -->
        <div id="catalog-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-5 auto-rows-fr">

          <!-- 1. TARJETA CON EL BOTÓN '+' (Solo visible para Admin) -->
          <div id="add-product-card" class="hidden border-2 border-dashed border-zinc-700 hover:border-amber-500 bg-zinc-950/40 hover:bg-zinc-950 rounded-2xl p-5 flex flex-col items-center justify-center min-h-[280px] cursor-pointer transition-all group shadow-sm w-full mx-auto lg:mx-0">
            <div class="w-14 h-14 rounded-2xl bg-zinc-900 border border-zinc-800 group-hover:border-amber-500/50 flex items-center justify-center text-amber-500 group-hover:scale-105 transition-all shadow-inner">
              <span class="text-3xl font-light">+</span>
            </div>
            <p class="mt-4 font-mono text-xs uppercase text-zinc-400 group-hover:text-amber-400 font-bold tracking-wider">
              Agregar un producto
            </p>
          </div>

          <!-- 2. TARJETA FORMULARIO (Se muestra al hacer clic en '+') -->
          <div id="create-product-card" class="hidden bg-zinc-950 border border-amber-500/60 rounded-2xl p-4 flex flex-col gap-4 shadow-2xl col-span-full sm:col-span-2 lg:col-span-2 xl:col-span-3 w-full max-w-full mx-auto lg:max-w-none">
            <div class="flex items-center justify-between border-b border-zinc-800 pb-3">
              <h3 class="font-sans font-bold text-xs uppercase tracking-wider text-amber-500">Nuevo Producto</h3>
              <button id="close-form-btn" type="button" class="text-zinc-500 hover:text-zinc-200 text-sm font-mono p-1 rounded-lg hover:bg-zinc-900 transition-colors">✕</button>
            </div>

            <form id="new-product-form" class="grid gap-4 md:grid-cols-2">
              <!-- Input Nombre -->
              <div class="flex flex-col gap-1 md:col-span-2">
                <label class="text-[11px] sm:text-sm font-mono uppercase tracking-wider text-zinc-400">Nombre</label>
                <input 
                  type="text" 
                  id="prod-name" 
                  placeholder="Ej. Inversor de Soldadura 200A" 
                  required 
                  class="bg-zinc-900 border border-zinc-800 focus:border-amber-500 text-zinc-100 text-sm rounded-xl p-3 outline-none placeholder:text-zinc-600 transition-all font-sans"
                />
              </div>

              <!-- Input SKU -->
              <div class="flex flex-col gap-1 md:col-span-1">
                <label class="text-[11px] sm:text-sm font-mono uppercase tracking-wider text-zinc-400">SKU</label>
                <input 
                  type="text" 
                  id="prod-sku" 
                  placeholder="Ej. SZ-200A" 
                  required 
                  class="bg-zinc-900 border border-zinc-800 focus:border-amber-500 text-zinc-100 text-sm rounded-xl p-3 outline-none placeholder:text-zinc-600 transition-all font-sans"
                />
              </div>

              <!-- Input Precio -->
              <div class="flex flex-col gap-1 md:col-span-1">
                <label class="text-[11px] sm:text-sm font-mono uppercase tracking-wider text-zinc-400">Precio ($)</label>
                <input 
                  type="number" 
                  step="0.01" 
                  id="prod-price" 
                  placeholder="0.00" 
                  required 
                  class="bg-zinc-900 border border-zinc-800 focus:border-amber-500 text-zinc-100 text-sm rounded-xl p-3 outline-none placeholder:text-zinc-600 transition-all font-mono"
                />
              </div>

              <!-- Input Stock -->
              <div class="flex flex-col gap-1 md:col-span-1">
                <label class="text-[11px] sm:text-sm font-mono uppercase tracking-wider text-zinc-400">Stock</label>
                <input 
                  type="number" 
                  id="prod-stock" 
                  placeholder="0" 
                  min="0" 
                  class="bg-zinc-900 border border-zinc-800 focus:border-amber-500 text-zinc-100 text-sm rounded-xl p-3 outline-none placeholder:text-zinc-600 transition-all font-mono"
                />
              </div>

              <!-- Input Categoría -->
              <div class="flex flex-col gap-1 md:col-span-1">
                <label class="text-[11px] sm:text-sm font-mono uppercase tracking-wider text-zinc-400">Categoría</label>
                <input 
                  type="text" 
                  id="prod-category" 
                  placeholder="Ej. Electrodos, Inversores..." 
                  required 
                  class="bg-zinc-900 border border-zinc-800 focus:border-amber-500 text-zinc-100 text-sm rounded-xl p-3 outline-none placeholder:text-zinc-600 transition-all font-sans"
                />
              </div>

              <!-- Input Disponibilidad -->
              <div class="flex flex-col gap-1 md:col-span-1">
                <label class="text-[11px] sm:text-sm font-mono uppercase tracking-wider text-zinc-400">Disponibilidad</label>
                <select id="prod-availability" class="bg-zinc-900 border border-zinc-800 focus:border-amber-500 text-zinc-100 text-sm rounded-xl p-3 outline-none transition-all font-sans">
                  <option value="available">Disponible</option>
                  <option value="unavailable">No disponible</option>
                </select>
              </div>

              <!-- Input Breve Descripción -->
              <div class="flex flex-col gap-1 md:col-span-2">
                <label class="text-[10px] font-mono uppercase tracking-wider text-zinc-400">Descripción</label>
                <textarea 
                  id="prod-desc" 
                  placeholder="Breve descripción técnica..." 
                  rows="3"
                  class="bg-zinc-900 border border-zinc-800 focus:border-amber-500 text-zinc-100 text-xs rounded-xl p-3 outline-none placeholder:text-zinc-600 transition-all font-sans resize-none"
                ></textarea>
              </div>

              <!-- Input URL de Imagen -->
              <div class="flex flex-col gap-1 md:col-span-2">
                <label class="text-[10px] font-mono uppercase tracking-wider text-zinc-400">Imágenes (URLs separadas por coma)</label>
                <textarea 
                  id="prod-img" 
                  placeholder="https://ejemplo.com/uno.jpg, https://ejemplo.com/dos.jpg"
                  rows="2"
                  class="bg-zinc-900 border border-zinc-800 focus:border-amber-500 text-zinc-100 text-xs rounded-xl p-3 outline-none placeholder:text-zinc-600 transition-all font-mono resize-none min-h-[90px]"
                ></textarea>
              </div>

              <!-- Botón Submit -->
              <button 
                type="submit" 
                class="md:col-span-2 mt-2 bg-amber-500 hover:bg-amber-400 text-zinc-950 font-mono text-xs font-black py-3 rounded-xl uppercase tracking-wider transition-all shadow-lg cursor-pointer"
              >
                Guardar Producto
              </button>
            </form>
          </div>

          <!-- 3. PRODUCTOS DEL CATÁLOGO -->
          <div id="products-container" class="contents"></div>

        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="./index.js"></script>
  </body>
</html>
