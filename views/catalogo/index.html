<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soldaduras Zamora - Catálogo</title>
    <link rel="stylesheet" href="/output.css" />
  </head>
  <body class="bg-zinc-900 text-white min-h-screen flex flex-col font-sans selection:bg-amber-500 selection:text-zinc-950 overflow-x-hidden">
    
    <!-- NOTIFICACIONES -->
    <div id="notification"></div>

    <!-- NAVBAR SUPERIOR -->
    <div id="navBar"></div>

    <!-- BARRA DE BÚSQUEDA -->
    <div class="sticky top-[61px] sm:top-[69px] bg-zinc-900/95 backdrop-blur-md p-4 sm:px-6 pb-3 z-30 w-full border-b border-zinc-800/60">
      <div class="w-full max-w-7xl mx-auto flex justify-center">
        <div class="w-full max-w-5xl">
          <form id="search-form" class="w-full flex">
            <input
              type="text"
              id="search-input"
              placeholder="Buscar electrodos, inversores, herramientas..."
              class="w-full bg-zinc-950 text-white placeholder-zinc-500 font-mono text-xs sm:text-sm px-4 py-3 rounded-xl border border-zinc-700/80 outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all shadow-inner"
            />
          </form>
        </div>
      </div>
    </div>

    <!-- CUERPO PRINCIPAL -->
    <div class="flex flex-col lg:flex-row w-full max-w-8xl mx-auto px-4 sm:px-6 py-6 gap-6 flex-1 items-start min-w-0">
      
      <!-- BARRA LATERAL CATEGORÍAS -->
      <aside class="w-full lg:w-64 shrink-0 lg:sticky lg:top-[140px]">
        <div class="bg-zinc-950 border border-zinc-800 rounded-2xl p-5 flex flex-col gap-4 shadow-xl">
          <h2 class="font-sans font-black text-xs uppercase tracking-widest text-amber-500 border-b border-zinc-800 pb-3">
            Categorías
          </h2>
          <ul class="font-mono text-[11px] sm:text-sm uppercase tracking-wide flex flex-col gap-2.5 text-zinc-300">
            <!-- Cargado dinámicamente -->
          </ul>
        </div>
      </aside>

      <!-- CATÁLOGO DE PRODUCTOS -->
      <main class="flex-1 flex flex-col gap-6 w-full min-w-0">

        <!-- HEADER DE LA SECCIÓN -->
        <header class="bg-zinc-950 border border-zinc-800 rounded-2xl p-4 sm:p-5 flex items-center gap-4 shadow-md">
          <div class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center font-black text-amber-500 text-sm shadow-inner">
            SZ
          </div>
          <h1 id="current-category-name" class="font-sans font-bold text-base sm:text-lg uppercase text-zinc-100 tracking-wide">
            Todas las Categorías
          </h1>
        </header>

        <div id="product-detail-view" class="hidden w-full">
          <div class="bg-zinc-950 border border-zinc-800 rounded-2xl p-5 sm:p-6 shadow-xl">
            <button id="back-to-catalog-btn" type="button" class="mb-4 text-sm font-mono uppercase tracking-wider text-zinc-400 hover:text-amber-400 transition-colors">
              ← Volver al catálogo
            </button>
            <div id="product-detail-content" class="flex flex-col gap-10 lg:flex-row lg:items-start"></div>
          </div>
        </div>

        <!-- GRID DE PRODUCTOS + TARJETA DE AGREGAR -->
        <div id="catalog-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-5 auto-rows-fr">

          <!-- 1. TARJETA CON EL BOTÓN '+' (Solo visible para Admin) -->
          <div id="add-product-card" class="hidden border-2 border-dashed border-zinc-700 hover:border-amber-500 bg-zinc-950/40 hover:bg-zinc-950 rounded-2xl p-5 flex flex-col items-center justify-center min-h-[280px] cursor-pointer transition-all group shadow-sm w-full mx-auto lg:mx-0">
            <div class="w-14 h-14 rounded-2xl bg-zinc-900 border border-zinc-800 group-hover:border-amber-500/50 flex items-center justify-center text-amber-500 group-hover:scale-105 transition-all shadow-inner">
              <span class="text-3xl font-light">+</span>
            </div>
            <p class="mt-4 font-mono text-xs uppercase text-zinc-400 group-hover:text-amber-400 font-bold tracking-wider">
              Agregar un producto
            </p>
          </div>

          <!-- 2. TARJETA FORMULARIO (Se muestra al hacer clic en '+') -->
          

          
          <!-- 3. PRODUCTOS DEL CATÁLOGO -->
          <div id="products-container" class="contents"></div>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="./index.js"></script>
    <script src="/components/navbar.js"></script>
  </body>
</html>
